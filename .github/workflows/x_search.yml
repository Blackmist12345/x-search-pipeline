name: X Search Pipeline

on:
  workflow_dispatch:
  schedule:
    # JST 7:00 〜 翌0:00 まで毎時0分（計18回稼働）
    - cron: '0 22-23,0-15 * * *'

permissions:
  contents: write

jobs:
  run-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Pipeline
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_KEYWORDS_DB_ID: ${{ secrets.NOTION_KEYWORDS_DB_ID }}
          NOTION_EXCLUDES_DB_ID: ${{ secrets.NOTION_EXCLUDES_DB_ID }}
          NOTION_GENRES_DB_ID: ${{ secrets.NOTION_GENRES_DB_ID }}
          NOTION_CONFIG_DB_ID: ${{ secrets.NOTION_CONFIG_DB_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python -u main.py

      - name: Commit and push processed IDs and cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_ids.json notion_cache.json || true
          git commit -m "chore: auto-update processed IDs and cache [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || true
